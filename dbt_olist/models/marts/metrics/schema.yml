version: 2

models:
  - name: mart_tableau_payment_mix
    description: "Single Tableau-ready payment mart at payment transaction grain for payment method mix dashboards."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - payment_sequential
    columns:
      - name: payment_key
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: payment_sequential
        tests:
          - not_null
      - name: payment_type
        description: "Raw normalized payment method from Olist."
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_type_label
        description: "Display-friendly payment method label for Tableau."
        tests:
          - not_null
      - name: installment_bucket
        description: "Payment installment bucket for Tableau grouping."
        tests:
          - not_null
      - name: payment_installments
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: payment_value
        description: "Payment transaction amount. Safe to sum in this payment-grain mart."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: month_start_date
        description: "Month bucket used as the main Tableau date filter."
        tests:
          - not_null
      - name: customer_state
        description: "Customer geography filter for Tableau."
        tests:
          - not_null
      - name: payment_share_of_order
        description: "Payment row share of total order payment value."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
              config:
                where: "payment_share_of_order is not null"

  - name: mart_tableau_sales_dashboard
    description: "Single Tableau-ready mart at order-item grain so KPI cards and charts can share synchronized dashboard filters."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: month_start_date
        description: "Month bucket used as the main Tableau date filter."
        tests:
          - not_null
      - name: product_category_name_english
        description: "Product category filter for Tableau."
        tests:
          - not_null
      - name: seller_id
        description: "Seller filter and drill-down identifier."
        tests:
          - not_null
      - name: customer_state
        description: "Customer geography filter for Tableau."
        tests:
          - not_null
      - name: item_total_amount
        description: "Item-level GMV amount, price plus freight."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: gmv
        description: "Alias of item_total_amount for Tableau KPI readability."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: allocated_payment_value
        description: "Order payment value allocated to item rows to prevent duplicated payment totals in Tableau."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: order_weight
        description: "1/order_item_count, useful for weighted order-level metrics."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
              config:
                where: "order_weight is not null"
      - name: is_delivered_on_time_int
        description: "1 when delivered on time, 0 when late, null when not applicable."
        tests:
          - accepted_values:
              values: [0, 1]
              config:
                where: "is_delivered_on_time_int is not null"

  - name: agg_monthly_sales
    description: "Monthly sales KPI mart for Tableau executive dashboards."
    columns:
      - name: month_start_date
        tests:
          - unique
          - not_null
      - name: gmv
        description: "Gross merchandise value based on item price plus freight."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: payment_value_total
        description: "Total payment value by month."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: average_order_value
        description: "Average order value by month."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: on_time_delivery_rate
        description: "Ratio of orders delivered on or before estimated delivery date."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
              config:
                where: "on_time_delivery_rate is not null"
      - name: avg_review_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5
              inclusive: true
              config:
                where: "avg_review_score is not null"

  - name: agg_product_category_performance
    description: "Product category performance mart for revenue and item analysis."
    columns:
      - name: product_category_name_english
        tests:
          - unique
          - not_null
      - name: total_amount
        description: "Total line item amount including freight."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: item_price_total
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: freight_value_total
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: agg_delivery_performance
    description: "Delivery performance mart by customer state and city."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_state
            - customer_city
    columns:
      - name: customer_state
        tests:
          - not_null
      - name: total_orders
        description: "Number of orders for the geography."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: on_time_delivery_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
              config:
                where: "on_time_delivery_rate is not null"
      - name: gmv
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: avg_review_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5
              inclusive: true
              config:
                where: "avg_review_score is not null"

  - name: agg_seller_performance
    description: "Seller performance mart by seller geography."
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: total_amount
        description: "Total seller line item amount including freight."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: item_price_total
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: freight_value_total
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
